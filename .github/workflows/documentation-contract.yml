name: Public command documentation

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:
  workflow_call:
    secrets:
      DOCS_REFERENCE_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  reference:
    name: CLI command reference coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Install only CLI runtime dependencies
        run: npm install --omit=dev --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Resolve the coordinated documentation review branch
        env:
          REVIEW_BRANCH: ${{ github.head_ref || github.ref_name }}
          GH_TOKEN: ${{ secrets.DOCS_REFERENCE_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';

          const token = process.env.GH_TOKEN;
          if (!token) {
            console.error('::error::Configure DOCS_REFERENCE_TOKEN with read-only Contents access to Chainabit/docs.');
            process.exit(1);
          }
          const branch = process.env.REVIEW_BRANCH ?? '';
          if (/[\r\n]/.test(branch)) throw new Error('Invalid documentation review branch');
          let ref = 'development';
          if (/^(feature|fix|refactor|hotfix)\//.test(branch)) {
            let response;
            try {
              response = await fetch(`https://api.github.com/repos/Chainabit/docs/git/matching-refs/heads/${encodeURIComponent(branch)}`, {
                headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' },
                redirect: 'error',
                signal: AbortSignal.timeout(15_000),
              });
            } catch {
              throw new Error('Documentation branch lookup unavailable; retry the reference check.');
            }
            if (!response.ok) throw new Error(`Documentation branch lookup failed (HTTP ${response.status}); verify DOCS_REFERENCE_TOKEN access.`);
            const refs = await response.json().catch(() => {
              throw new Error('Invalid documentation branch lookup response');
            });
            if (!Array.isArray(refs)) throw new Error('Invalid documentation branch lookup response');
            if (refs.some(candidate => candidate?.ref === `refs/heads/${branch}`)) ref = branch;
          }
          appendFileSync(process.env.GITHUB_ENV, `DOCS_REFERENCE_REF=${ref}\n`);
          NODE
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Chainabit/docs
          token: ${{ secrets.DOCS_REFERENCE_TOKEN }}
          ref: ${{ env.DOCS_REFERENCE_REF }}
          path: .reference-docs
          persist-credentials: false
      - name: Require reviewed syntax and bilingual documentation
        # This job runs before semantic-release assigns/publishes a version,
        # including on main. Check the reviewed candidate against development;
        # the docs workflow separately verifies the actual npm stable release.
        working-directory: .reference-docs
        run: node scripts/sync-cli-reference.mjs --check --cli ../bin/chainabit.cjs --edition development --output "$RUNNER_TEMP/cli-reference.json"
