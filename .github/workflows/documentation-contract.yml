name: Public command documentation

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:
  workflow_call:
    secrets:
      DOCS_REFERENCE_SSH_KEY:
        required: true

permissions:
  contents: read

jobs:
  reference:
    name: CLI command reference coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Install only CLI runtime dependencies
        run: npm install --omit=dev --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Resolve the coordinated documentation review branch
        # Chainabit/docs is private. Access is a read-only deploy key on that repository only
        # (secret DOCS_REFERENCE_SSH_KEY); GitHub's host keys come from its HTTPS meta API.
        env:
          REVIEW_BRANCH: ${{ github.head_ref || github.ref_name }}
          DOCS_REFERENCE_SSH_KEY: ${{ secrets.DOCS_REFERENCE_SSH_KEY }}
        run: |
          if [ -z "$DOCS_REFERENCE_SSH_KEY" ]; then
            echo '::error::Configure DOCS_REFERENCE_SSH_KEY: the private half of a read-only deploy key on Chainabit/docs.'
            exit 1
          fi
          case "$REVIEW_BRANCH" in
            *$'\n'*|*$'\r'*) echo '::error::Invalid documentation review branch'; exit 1 ;;
          esac
          ref=development
          if printf '%s' "$REVIEW_BRANCH" | grep -Eq '^(feature|fix|refactor|hotfix)/'; then
            dir="$(mktemp -d)"
            trap 'rm -rf "$dir"' EXIT
            ( umask 077; printf '%s\n' "$DOCS_REFERENCE_SSH_KEY" > "$dir/key" )
            curl -fsS --max-time 15 https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > "$dir/known_hosts" \
              || { echo '::error::Documentation branch lookup unavailable; retry the reference check.'; exit 1; }
            heads="$(GIT_SSH_COMMAND="ssh -i $dir/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$dir/known_hosts" \
              timeout 30 git ls-remote --heads git@github.com:Chainabit/docs.git)" \
              || { echo '::error::Documentation branch lookup failed; verify the DOCS_REFERENCE_SSH_KEY deploy key.'; exit 1; }
            if printf '%s\n' "$heads" | awk '{print $2}' | grep -qxF "refs/heads/$REVIEW_BRANCH"; then ref="$REVIEW_BRANCH"; fi
          fi
          echo "DOCS_REFERENCE_REF=$ref" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Chainabit/docs
          ssh-key: ${{ secrets.DOCS_REFERENCE_SSH_KEY }}
          ref: ${{ env.DOCS_REFERENCE_REF }}
          path: .reference-docs
          persist-credentials: false
      - name: Require reviewed syntax and bilingual documentation
        # This job runs before semantic-release assigns/publishes a version,
        # including on main. Check the reviewed candidate against development;
        # the docs workflow separately verifies the actual npm stable release.
        working-directory: .reference-docs
        run: node scripts/sync-cli-reference.mjs --check --cli ../bin/chainabit.cjs --edition development --output "$RUNNER_TEMP/cli-reference.json"
