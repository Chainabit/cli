name: Release

# Versions and publishes the chainabit package to npm with semantic-release.
# The version bump (major/minor/patch) is derived from Conventional Commits
# since the last release (feat -> minor, fix -> patch, "BREAKING CHANGE" ->
# major); semantic-release creates the git tag and GitHub Release, then
# publishes to npm with provenance. It does not push generated version
# metadata to the protected main branch.
#
# Every push to main releases (owner decision 2026-11-02): main is the release branch.
#   - push to main: runs the documentation contract, command tests, distribution
#     safety check and smoke test, then `semantic-release`, which publishes only
#     when the commits since the last release call for one (feat, fix, BREAKING).
#   - workflow_dispatch with dry_run=true (default): the same gates and a dry run.
#   - workflow_dispatch with dry_run=false: a manual release of main.
# npm authentication is trusted publishing (OIDC, `id-token: write` below) for
# Chainabit/cli publish.yml; NPM_TOKEN is only a fallback.
#
# The command tests, distribution safety check, and smoke test run BEFORE
# semantic-release, so a bad sync from the private source repo (see
# chainabit-api's release-cli.yml, which pushes the built bin/chainabit.cjs to
# this repo's main/development branch) fails loudly here instead of ever
# reaching npm.
#
# Required repository secrets:
#   NPM_TOKEN     — an npm automation token with publish rights to "chainabit".
#   GITHUB_TOKEN  — provided automatically by Actions; used for the tag and
#                   GitHub Release that semantic-release creates.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (analyze + report the next version). Set to false to publish to npm; a push to main always releases."
        type: boolean
        default: true

permissions:
  contents: write # semantic-release creates the release tag and GitHub Release
  id-token: write # npm provenance (OIDC)
  issues: write # semantic-release comments on released issues/PRs
  pull-requests: write

jobs:
  documentation-contract:
    uses: ./.github/workflows/documentation-contract.yml
    permissions:
      contents: read
    secrets:
      DOCS_REFERENCE_SSH_KEY: ${{ secrets.DOCS_REFERENCE_SSH_KEY }}
  release-typing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: The commits since the last release are typed for what they change
        run: |
          LAST="$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)"
          if [ -z "$LAST" ]; then echo "no release tag: nothing to compare"; exit 0; fi
          node scripts/check-release-typing.mjs "$LAST" HEAD
  release:
    needs: [documentation-contract, release-typing]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # semantic-release needs full history to analyze commits since the last release
          persist-credentials: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install runtime dependencies
        run: npm install --omit=dev --no-package-lock

      - name: Test every CLI command path and behavior contracts
        run: npm test

      - name: Distribution safety check
        run: node scripts/check-dist-safety.mjs

      - name: Smoke test
        run: |
          node ./bin/chainabit.cjs --help
          node ./bin/chainabit.cjs --version

      # Exact versions only; each was published at least 14 days before pinning.
      # Bump deliberately (review the changelog), never float.
      - name: Install release tooling
        run: npm install --no-save --package-lock=false semantic-release@25.0.9 @semantic-release/commit-analyzer@13.0.1 @semantic-release/github@12.0.10 @semantic-release/npm@13.2.0 @semantic-release/release-notes-generator@14.1.1

      - name: Release (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: ./node_modules/.bin/semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Release
        if: github.event_name == 'push' || !inputs.dry_run
        run: ./node_modules/.bin/semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
